<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Builder - FormForge</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header animate-fade-down">
            <h1 class="logo">FormForge</h1>
            <p class="tagline">Create beautiful forms in minutes</p>
        </header>

        <!-- Form Settings -->
        <div class="card card-accent animate-fade-up delay-1 mb-30">
            <input 
                type="text" 
                id="formTitle" 
                placeholder="Form Title"
                value="My Awesome Form"
                class="mono mb-20"
                style="font-size: 1.5rem; border-bottom: 2px solid var(--border-color);"
            >
            <textarea 
                id="formDescription" 
                placeholder="Form description (optional)"
                style="min-height: 80px;"
            ></textarea>
        </div>

        <!-- Questions Container -->
        <div id="questionsContainer" class="mb-30">
            <!-- Questions added dynamically -->
        </div>

        <!-- Add Question Button -->
        <button class="btn btn-secondary btn-full mb-30 hover-lift" id="addQuestionBtn">
            <span style="font-size: 1.5rem;">+</span> Add Question
        </button>

        <!-- Action Buttons -->
        <div class="flex-between flex-gap">
            <button class="btn btn-secondary" id="previewBtn">Preview</button>
            <button class="btn btn-primary" id="publishBtn">Publish Form</button>
        </div>
    </div>

    <!-- Publish Success Modal -->
    <div class="modal" id="publishModal">
        <div class="modal-content animate-scale">
            <h2 style="color: var(--accent-cyan); margin-bottom: 20px;">Form Published! 🎉</h2>
            <p class="mb-20" style="color: var(--text-gray);">
                Share this link to collect responses:
            </p>
            
            <div class="flex-between flex-gap mb-30">
                <input 
                    type="text" 
                    id="publishedUrl" 
                    readonly 
                    class="mono"
                    style="flex: 1;"
                >
                <button class="btn btn-primary" id="copyUrlBtn" onclick="copyUrl()">
                    Copy
                </button>
            </div>
            
            <div class="flex-between flex-gap">
                <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                <a href="#" id="viewFormLink" target="_blank" class="btn btn-primary">View Form</a>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../js/config.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/builder.js"></script>
</body>
</html>
