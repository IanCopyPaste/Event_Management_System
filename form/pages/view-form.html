<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - FormForge</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
    <div class="container container-small">
        <!-- Form Container -->
        <div id="formContainer">
            <!-- Form Header -->
            <div class="card card-accent animate-fade-down mb-30" style="text-align: center;">
                <h1 id="formTitle" class="mono" style="font-size: 2rem; color: var(--accent-cyan); margin-bottom: 15px;">
                    Loading...
                </h1>
                <p id="formDescription" style="color: var(--text-gray); display: none;"></p>
            </div>

            <!-- Form Questions -->
            <form id="responseForm">
                <div id="questionsContainer">
                    <!-- Questions loaded dynamically -->
                </div>

                <button type="submit" class="btn btn-primary btn-full mt-30 hover-lift" id="submitBtn">
                    Submit Response
                </button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="successContainer" style="display: none;">
            <div class="card card-accent animate-scale" style="text-align: center; padding: 60px 40px;">
                <div style="font-size: 4rem; margin-bottom: 20px;">✓</div>
                <h2 class="mono" style="color: var(--accent-cyan); margin-bottom: 15px;">
                    Response Submitted!
                </h2>
                <p style="color: var(--text-gray);">
                    Thank you for your response. Your answers have been recorded.
                </p>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../js/config.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/form-display.js"></script>
</body>
</html>
