<div class="sponSettings-container">
    <button id="sponLogout">Logout</button>
</div>
<script>
    document.querySelector("#sponLogout").addEventListener("click",async()=>{
        const r = await fetch("backend/forBackendData/logout.php");
        const d = await r.json();
        alert(d.message);
        location.href = "loginLanding.php"
    });
</script>
