<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Barlow', sans-serif;
    }

    .orgsApply-container {
        width: 100%;
        margin-top: 30px;
    }

    .utilities-container {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0px 10px;
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .field label {
        font-size: 12px;
        font-weight: 600;
    }

    .utilities-container select,
    .utilities-container input {
        padding: 10px 12px;
        border: 1px solid #cfe8ff;
        border-radius: 6px;
        outline: none;
    }

    .utilities-container select:focus,
    .utilities-container input:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
    }

    #txtSearchbar {
        margin-left: auto;
        width: 240px;
    }

    .utilities-container select:hover,
    .utilities-container input:hover {
        border-color: #b0b0b0;
    }

    .table-wrapper {
        width: 100%;
        overflow-x: auto;
        border-radius: 12px;
        border: 1px solid #cfe8ff;
    }

    .orgApplication-table {
        margin-top: 20px;
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
    }

    .orgApplication-table thead {
        background: rgba(0, 65, 156, 1);
    }

    .orgApplication-table tbody {
        overflow-y: auto;
        scrollbar-width: thin;
    }

    .orgApplication-table th {
        padding: 12px;
        text-align: left;
        font-size: 13px;
        color: #ffffff;
        border-bottom: 1px solid #cfe8ff;
    }

    .orgApplication-table td {
        padding: 12px;
        font-size: 13px;
        color: #334155;
        border-bottom: 1px solid #e0f0ff;
        max-width: 200px;
    }

    .orgApplication-table td button {
        padding: 5px 10px;
        background-color: rgba(0, 65, 156, 1);
        color: white;
        border: none;
        border-radius: 3px;
        outline: none;
    }

    .orgApplication-table td button:hover {
        cursor: pointer;
    }

    .orgApplication-table tbody tr:hover {
        background: #f0f8ff;
    }

    .empty {
        text-align: center;
        color: #60a5fa;
        padding: 20px;
    }

    .orgInfo-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        height: 90vh;
        width: 60%;
        background-color: white;
        border-radius: 14px;
        border: 1px solid rgba(83, 155, 255, 0.3);
        box-shadow: 0 20px 40px rgba(0, 65, 156, 0.2);
        display: none;
        flex-direction: column;
        overflow: hidden;
    }

    .btnCloseModal {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 1.3rem;
        background: transparent;
        border: none;
        color: rgba(0, 65, 156, 1);
    }

    .btnCloseModal:hover {
        cursor: pointer;
        opacity: 0.7;
    }

    .allOrgInfo-container {
        padding: 30px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        overflow-y: auto;
        scrollbar-width: thin;
    }

    .allOrgInfo-container input {
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid rgba(117, 117, 117, 0.3);
        background: #ffffff;
        color: rgb(0, 0, 0);
        font-size: 13px;
    }

    .file-preview {
        grid-column: span 2;
        height: 600px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(83, 155, 255, 0.3);
    }

    .file-preview iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .btnDownload {
        grid-column: span 2;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background: rgba(83, 155, 255, 1);
        color: white;
        font-weight: 600;
        cursor: pointer;
    }

    .btnDownload:hover {
        background: rgba(0, 65, 156, 1);
    }

    .approvalUtil-container {
        padding: 16px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid rgba(83, 155, 255, 0.2);
    }

    .approvalUtil-container button {
        padding: 10px 18px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        cursor: pointer;
    }

    .approvalUtil-container p {
        color: red;
        margin-right: 10px;
        visibility: hidden;
    }

    .btnApprove {
        background: rgb(77, 160, 0);
        color: white;
    }

    .btnReject {
        background: rgb(211, 0, 0);
        color: white;
    }

    .btnCancel {
        background: white;
        border: 1px solid rgba(83, 155, 255, 0.5);
        color: rgb(0, 0, 0);
    }

    .btnApprove:hover {
        opacity: 0.9;
    }

    .btnReject:hover {
        opacity: 0.9;
    }

    .btnCancel:hover {
        background: rgba(83, 155, 255, 0.1);
    }

    .btnDownloadDisabled {
        grid-column: span 2;
        padding: 12px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        background-color: grey;
        color: black;
    }

    .btnDisabled {
        background-color: grey;
        cursor: not-allowed;
    }
</style>

<div class="orgsApply-container">
    <div class="utilities-container">
        <div class="field">
            <label for="sortByNewest">Sort By Date/Name</label>
            <select id="sortByNewest">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="az">Organization Name (A-Z)</option>
                <option value="za">Organization Name (Z-A)</option>
            </select>
        </div>

        <input type="text" id="txtSearchbar" placeholder="Search...">
    </div>

    <table class="orgApplication-table">
        <thead>
            <tr>
                <th>Application ID</th>
                <th>Org name</th>
                <th>Org Email</th>
                <th>Org Contact No.</th>
                <th>Department Name</th>
                <th>Organizer ID</th>
                <th>Organizer Name</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr class="empty">
                <td colspan="9">No data available</td>
            </tr>
        </tbody>
    </table>
     </div>
</div>

<div class="orgInfo-modal">
    <h3 style="margin:20px">Organization Preview Panel</h3>
    <button class="btnCloseModal">✕</button>

    <div class="allOrgInfo-container">
        <label>Application ID</label>
        <input id="txtOrg_application_id" readonly>

        <label>Organization Name</label>
        <input id="txtOrg_name" readonly>

        <label>Organization Email</label>
        <input id="txtOrg_email" readonly>

        <label>Contact Number</label>
        <input id="txtOrg_contact_no" readonly>

        <label>Department</label>
        <input id="txtOrg_department_name" readonly>

        <label>Organizer ID</label>
        <input id="txtOrganizer_id" readonly>

        <label>Organizer Name</label>
        <input id="txtOrganizer_name" readonly>

        <label>Created At</label>
        <input id="txtCreated_at" readonly>
    </div>
</div>

<script>
const tableBody = document.querySelector(".orgApplication-table tbody");
let org_id = null;

document.addEventListener("DOMContentLoaded", loadOrganizations);

async function loadOrganizations() {
    const res = await fetch("backend/forBackendData/adminNorgs/manage/displayOrgs.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ org_id: null })
    });

    const data = await res.json();
    renderTable(data.record);
}

function renderTable(records) {
    tableBody.innerHTML = "";

    if (!records || records.length === 0) {
        tableBody.innerHTML = `<tr class="empty"><td colspan="7">No data available</td></tr>`;
        return;
    }

    records.forEach(e => {
        tableBody.innerHTML += `
        <tr>
            <td>${e.org_id}</td>
            <td>${e.org_name}</td>
            <td>${e.org_email}</td>
            <td>${e.org_contact_no}</td>
            <td>${e.department_name}</td>
            <td>${e.users_id}</td>
            <td>${e.organizer}</td>
            <td><button data-id="${e.org_id}">⌕ View</button></td>
        </tr>`;
    });
}

tableBody.addEventListener("click", e => {
    if (e.target.tagName === "BUTTON") {
        org_id = e.target.dataset.id;
        document.querySelector(".orgInfo-modal").style.display = "flex";
        fetchOrganization(org_id);
    }
});

document.querySelector(".btnCloseModal").onclick = () => {
    document.querySelector(".orgInfo-modal").style.display = "none";
};

async function fetchOrganization(id) {
    const res = await fetch("backend/forBackendData/adminNorgs/manage/displayOrgs.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ org_id: id })
    });

    const d = await res.json();

    if (d.status === true) {
        const rec = d.record;

        document.querySelector("#txtOrg_application_id").value = rec.org_id;
        document.querySelector("#txtOrg_name").value = rec.org_name;
        document.querySelector("#txtOrg_email").value = rec.org_email;
        document.querySelector("#txtOrg_contact_no").value = rec.org_contact_no;
        document.querySelector("#txtOrg_department_name").value = rec.department_name;
        document.querySelector("#txtOrganizer_id").value = rec.users_id;
        document.querySelector("#txtOrganizer_name").value = rec.organizer;
        document.querySelector("#txtCreated_at").value = rec.created_at;
    }
}
</script>
