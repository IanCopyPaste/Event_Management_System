<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Barlow', sans-serif;
    }

    body {
        background: #f5f7fb;
    }

    .orgsApply-container {
        width: 100%;
        padding: 5px;
    }

    .manage-events {
        margin: 20px 0px;
        font-size: 27px;
        font-weight: 600;
        color: rgba(0, 65, 156, 1);
    }

    .utilities-container {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0px 10px;
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .field label {
        font-size: 12px;
        font-weight: 600;
    }

    .utilities-container select,
    .utilities-container input {
        padding: 10px 12px;
        border: 1px solid #cfe8ff;
        border-radius: 6px;
        outline: none;
    }

    #txtSearchbar {
        margin-left: auto;
        width: 240px;
    }

    .table-wrapper {
        width: 100%;
        overflow-x: auto;
        border-radius: 12px;
        border: 1px solid #cfe8ff;
        margin-top: 20px;
    }

    .orgApplication-table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
    }

    .orgApplication-table thead {
        background: rgba(0, 65, 156, 1);
    }

    .orgApplication-table th,
    .orgApplication-table td {
        padding: 12px;
        font-size: 13px;
        text-align: left;
        border-bottom: 1px solid #e0f0ff;
    }

    .orgApplication-table th {
        color: #fff;
    }

    .orgApplication-table tbody tr:hover {
        background: #f0f8ff;
    }

    .orgApplication-table td button {
        padding: 5px 10px;
        background-color: rgba(0, 65, 156, 1);
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }

    .empty {
        text-align: center;
        color: #60a5fa;
    }

    /* MODAL */
    .orgInfo-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        height: 70vh;
        width: 50%;
        background: white;
        border-radius: 14px;
        border: 1px solid rgba(83, 155, 255, 0.3);
        box-shadow: 0 20px 40px rgba(0, 65, 156, 0.2);
        display: none;
        flex-direction: column;
    }

    .btnCloseModal {
        position: absolute;
        top: 10px;
        right: 15px;
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
    }

    .allOrgInfo-container {
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .allOrgInfo-container input {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
    }

    .logo-upload {
        grid-column: span 2;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .logo-upload img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid #ddd;
    }

    .approvalUtil-container {
        margin-top: auto;
        padding: 15px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid #eee;
    }

    .approvalUtil-container button {
        padding: 8px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .btnApprove {
        background: green;
        color: white;
    }

    .btnReject {
        background: red;
        color: white;
    }

    .btnCancel {
        background: #ddd;
    }
</style>
</head>

<body>

    <div class="orgsApply-container">

        <p class="manage-events">Manage Departments</p>

        <div class="utilities-container">

            <div class="field">
                <label>Sort By</label>
                <select id="sortByDept">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="az">A-Z</option>
                    <option value="za">Z-A</option>
                </select>
            </div>

            <div class="field">
                <label>Filter</label>
                <select id="filterStatus">
                    <option value="all">All</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>

            <input type="text" id="txtSearchbar" placeholder="Search department...">

        </div>

        <div class="table-wrapper">
            <table class="orgApplication-table">
                <thead>
                    <tr>
                        <th>Logo</th>
                        <th>Department ID</th>
                        <th>Department Name</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="empty">
                        <td colspan="5">No departments available</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- MODAL -->
    <div class="orgInfo-modal" id="deptModal">

        <button class="btnCloseModal">✕</button>
        <h3 style="margin:20px">Department Details</h3>

        <div class="allOrgInfo-container">

            <div class="logo-upload">
                <label>Department Logo</label>
                <img id="logoPreview" src="" alt="logo">
                <input type="file" id="logoInput">
            </div>

            <label>ID</label>
            <input id="txtDept_id" readonly>

            <label>Name</label>
            <input id="txtDept_name" readonly>

            <label>Status</label>
            <input id="txtDept_status" readonly>

        </div>

        <div class="approvalUtil-container">
            <button class="btnApprove">Activate</button>
            <button class="btnReject">Deactivate</button>
            <button class="btnCancel">Close</button>
        </div>

    </div>

    <script>
        const tableBody = document.querySelector("tbody");
        const modal = document.getElementById("deptModal");
        const btnClose = document.querySelector(".btnCloseModal");
        const btnCancel = document.querySelector(".btnCancel");
        const logoInput = document.getElementById("logoInput");
        const logoPreview = document.getElementById("logoPreview");

        let selectedDept = {};
        let logoBase64 = "";

        logoInput.addEventListener("change", function () {
            const file = this.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                logoBase64 = e.target.result;
                logoPreview.src = logoBase64;
            };

            if (file) reader.readAsDataURL(file);
        });

        function renderDepartments(data) {
            tableBody.innerHTML = "";

            if (!data || data.length === 0) {
                tableBody.innerHTML = `<tr class='empty'><td colspan='5'>No departments available</td></tr>`;
                return;
            }

            data.forEach(d => {
                tableBody.innerHTML += `
        <tr>
            <td>${d.logo ? `<img src='${d.logo}' width='40'>` : '-'}</td>
            <td>${d.department_id}</td>
            <td>${d.department_name}</td>
            <td>${d.status}</td>
            <td><button data-id="${d.department_id}">View</button></td>
        </tr>`;
            });
        }

        tableBody.addEventListener("click", e => {
            if (e.target.tagName === "BUTTON") {
                selectedDept.id = e.target.dataset.id;
                modal.style.display = "flex";
                fetchDept(selectedDept.id);
            }
        });

        btnClose.onclick = btnCancel.onclick = () => modal.style.display = "none";

        function fetchDept(id) {
            document.getElementById("txtDept_id").value = id;
            document.getElementById("txtDept_name").value = "Sample Dept";
            document.getElementById("txtDept_status").value = "Active";
            logoPreview.src = "https://via.placeholder.com/120";
        }

        renderDepartments([
            { department_id: 1, department_name: "IT", status: "active", logo: "https://via.placeholder.com/40" },
            { department_id: 2, department_name: "HR", status: "inactive", logo: "" }
        ]);
    </script>
