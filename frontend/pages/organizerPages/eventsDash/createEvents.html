<style>
    .orgForm-container {
        margin: 5vh auto 10vh auto;
        width: 65%;
        padding: 25px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    #formLabel {
        margin-bottom: 30px;
        text-align: center;
        font-weight: 600;
        font-size: 1.6rem;
        color: rgba(0, 55, 158, 1);
    }

    .txtFields-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .full-width {
        grid-column: span 2;
    }

    .txtInputs-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
    }

    .txtInputs-container label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #444;
    }

    .txtInputs-container input,
    .txtInputs-container textarea {
        width: 100%;
        padding: 12px 10px;
        font-size: 0.95rem;
        border: 1px solid #dcdcdc;
        border-radius: 6px;
        outline: none;
        background: transparent;
        transition: 0.2s ease;
    }

    .txtInputs-container textarea {
        resize: none;
        min-height: 100px;
    }

    .txtInputs-container input:focus,
    .txtInputs-container textarea:focus {
        border-color: rgba(39, 115, 255, 1);
        box-shadow: 0 0 0 2px rgba(39, 115, 255, 0.1);
    }

    .section-card {
        grid-column: span 2;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 15px;
        background: #fafafa;
    }

    .section-card p {
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 10px;
        color: #444;
    }

    .checkbox-group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
    }

    .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ddd;
        cursor: pointer;
        transition: 0.2s ease;
        background: #fff;
    }

    .checkbox-item input {
        appearance: none;
        width: 16px;
        height: 16px;
        border: 2px solid #ccc;
        border-radius: 4px;
        position: relative;
    }

    .checkbox-item input:checked {
        background: rgba(39, 115, 255, 1);
        border-color: rgba(39, 115, 255, 1);
    }

    .checkbox-item input:checked::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 4px;
        width: 4px;
        height: 8px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .filesInput-container {
        grid-column: span 2;
        border: 1px dashed #ccc;
        border-radius: 8px;
        padding: 15px;
        background: #fafafa;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .btnSubmit-container {
        grid-column: span 2;
        display: flex;
        justify-content: center;
        margin-top: 10px;
    }

    .btnSubmit {
        width: 35%;
        font-weight: 600;
        font-size: 14px;
        padding: 12px;
        border-radius: 6px;
        border: none;
        background: rgba(39, 115, 255, 1);
        color: #fff;
        transition: 0.2s ease;
    }

    .btnSubmit:hover {
        transform: translateY(-2px);
    }

    .disabled {
        background: grey;
        cursor: not-allowed;
    }
</style>

<div class="orgForm-container">
    <p id="formLabel">Create an Event</p>

    <div class="txtFields-container">
    
        <div class="txtInputs-container full-width">
            <label for="event_name">Event Name</label>
            <input type="text" id="event_name">
        </div>

        <div class="txtInputs-container full-width">
            <label for="event_desc">Event Description</label>
            <textarea id="event_desc"></textarea>
        </div>

        <div class="txtInputs-container">
            <label for="event_location">Location</label>
            <input type="text" id="event_location">
        </div>

        <div class="txtInputs-container">
            <label for="event_capacity">Capacity</label>
            <input type="number" id="event_capacity">
        </div>

        <div class="txtInputs-container">
            <label for="event_start_date">Start Date</label>
            <input type="date" id="event_start_date">
        </div>

        <div class="txtInputs-container">
            <label for="event_end_date">End Date</label>
            <input type="date" id="event_end_date">
        </div>

        <div class="txtInputs-container">
            <label for="event_start_time">Start Time</label>
            <input type="time" id="event_start_time">
        </div>

        <div class="txtInputs-container">
            <label for="event_end_time">End Time</label>
            <input type="time" id="event_end_time">
        </div>

        <div class="txtInputs-container full-width">
            <label for="event_regs_deadline">Registration Deadline</label>
            <input type="datetime-local" id="event_regs_deadline">
        </div>

        <div class="section-card">
            <p>Restricted Year Levels</p>
            <div class="checkbox-group" id="year_levels">
                <label class="checkbox-item"><input type="checkbox" value="1st"><span>1st</span></label>
                <label class="checkbox-item"><input type="checkbox" value="2nd"><span>2nd</span></label>
                <label class="checkbox-item"><input type="checkbox" value="3rd"><span>3rd</span></label>
                <label class="checkbox-item"><input type="checkbox" value="4th"><span>4th</span></label>
                <label class="checkbox-item"><input type="checkbox" value="Alumni"><span>Alumni</span></label>
            </div>
        </div>

        <div class="section-card">
            <p>Restricted Programs</p>
            <div class="checkbox-group" id="programs"></div>
        </div>

        <div class="filesInput-container">
            <label>Event Background Photo</label>
            <input type="file" accept=".pdf,.jpg,.jpeg,.png">
        </div>

        <div class="btnSubmit-container">
            <button class="btnSubmit">Submit</button>
        </div>

        <p style="color: red; display: none; text-align: center; width: 100%;" id="pendingNotif">You still have a pending application</p>
    </div>
</div>

<script>
    const btnSubmit = document.querySelector(".btnSubmit");

    let restrictedEntities = {
        year_level: [],
        programs: []
    };
    async function getPrograms() {
        const container = document.querySelector("#programs");

        const response = await fetch("backend/forFrontendData/getPrograms.php");
        const data = await response.json();

        container.innerHTML = "";

        data.records.forEach(e => {
            container.innerHTML += `
            <label class="checkbox-item">
                <input type="checkbox" value="${e.program_id}">
                <span>${e.prog_abv}</span>
            </label>
        `;
        });
    }


    function updateArray(arr, value, checked) {
        if (checked) {
            if (!arr.includes(value)) arr.push(value);
        } else {
            const i = arr.indexOf(value);
            if (i > -1) arr.splice(i, 1);
        }

        console.log(restrictedEntities);
    }


    document.addEventListener("change", (e) => {

        if (e.target.closest("#year_levels")) {
            updateArray(
                restrictedEntities.year_level,
                e.target.value,
                e.target.checked
            );
        }

        if (e.target.closest("#programs")) {
            updateArray(
                restrictedEntities.programs,
                e.target.value,
                e.target.checked
            );
        }
        console.log(restrictedEntities);

    });

    function checkInputValue() {
        const fields = ["event_name", "event_desc", "event_location", "event_capacity", "event_start_date", "event_end_date", "event_start_time", "event_end_time", "event_regs_deadline"];
        let empty = false;
        fields.forEach(id => {
            const el = document.getElementById(id);
            if (!el.value.trim()) {
                empty = true;
                el.style.border = "2px solid red";
            } else {
                el.style.border = "1px solid #ccc";
            }
        });
        return empty ? false : true;
        //alert("Form valid");
    }

    btnSubmit.addEventListener("click", async () => {
        
        btnSubmit.classList.remove("disabled");
        btnSubmit.disbled = true;
        btnSubmit.classList.add("disabled");

        const event_name = document.querySelector("#event_name");
        const event_desc = document.querySelector("#event_desc");
        const event_location = document.querySelector("#event_location");
        const event_capacity = document.querySelector("#event_capacity");
        const event_start_date = document.querySelector("#event_start_date");
        const event_end_date = document.querySelector("#event_end_date");
        const event_start_time = document.querySelector("#event_start_time");
        const event_end_time = document.querySelector("#event_end_time");
        const event_regs_deadline = document.querySelector("#event_regs_deadline");
        const year_levels = document.querySelector("#year_levels");
        const programs = document.querySelector("#programs");
        const file_input = document.querySelector(".filesInput-container input[type='file']");

        if (!checkInputValue()) {
            alert("Please fill out the form");
            return;
        }
        const formData = new FormData();

        formData.append("event_name", event_name.value);
        formData.append("event_desc", event_desc.value);
        formData.append("event_location", event_location.value);
        formData.append("event_capacity", event_capacity.value);
        formData.append("event_start_date", event_start_date.value);
        formData.append("event_end_date", event_end_date.value);
        formData.append("event_start_time", event_start_time.value);
        formData.append("event_end_time", event_end_time.value);
        formData.append("event_regs_deadline", event_regs_deadline.value);
        formData.append("restricted", JSON.stringify(restrictedEntities));

        if (file_input.files.length > 0) {
            formData.append("file", file_input.files[0]);
        }

        const response = await fetch("backend/forBackendData/organizerNevents/submitEvents.php", {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        if (data.status == true) {
            sendEmail(event_name.value)
        }
        //location.reload();
    });

    async function hasPendingRow() {
        const btnSubmit = document.querySelector(".btnSubmit-container");
        const pending = document.querySelector("#pendingNotif");
        const response = await fetch("backend/forBackendData/organizerNevents/checkPendingEvents.php");
        const data = await response.json();
        if (data.status == true) {
            btnSubmit.style.display = "none";
            pending.style.display = "block"
        } else {
            btnSubmit.style.display = "flex";
            pending.style.display = "none"
        }
    }

    async function sendEmail(event_name) {
        const response = await fetch("backend/forBackendData/organizerNevents/sendEmail.php",{
            method: "POST",
            headers:{
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                "event_name": event_name
            })
        });
        const data = await response.json();
        if(data.status == true){
            alert("Application sent successfuly! Check your email for confirmation");
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        getPrograms()
        hasPendingRow();
        
    });
</script>
