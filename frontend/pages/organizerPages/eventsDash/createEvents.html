<style>
    :root {
        --primary-blue: #2773ff;
        --dark-blue: #00379e;
        --bg-gray: #f8f9fa;
        --border-color: #e2e8f0;
        --text-main: #334155;
    }

    .orgForm-container {
        margin: 5vh auto 10vh auto;
        width: 90%;
        max-width: 800px;
        padding: 40px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    #formLabel {
        margin-bottom: 35px;
        text-align: center;
        font-weight: 700;
        font-size: 2rem;
        color: var(--dark-blue);
        letter-spacing: -0.025em;
    }

    .txtFields-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
    }

    .full-width {
        grid-column: span 2;
    }

    .txtInputs-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .txtInputs-container label {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-main);
    }

    .txtInputs-container input,
    .txtInputs-container textarea {
        padding: 12px 16px;
        font-size: 1rem;
        border: 1.5px solid var(--border-color);
        border-radius: 8px;
        transition: all 0.2s ease;
        background: #fcfcfc;
    }

    .txtInputs-container input:focus,
    .txtInputs-container textarea:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 4px rgba(39, 115, 255, 0.15);
        background: #fff;
        outline: none;
    }

    .section-card {
        grid-column: span 2;
        border: 1.5px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        background: #fbfbfb;
    }

    .section-card p {
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 15px;
        color: var(--dark-blue);
    }

    .checkbox-group {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 12px;
    }

    .checkbox-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1.5px solid var(--border-color);
        background: white;
        transition: 0.2s;
        cursor: pointer;
        font-size: 0.85rem;
    }

    .checkbox-item:hover {
        border-color: var(--primary-blue);
    }

    .checkbox-item input {
        accent-color: var(--primary-blue);
        width: 18px;
        height: 18px;
    }

    .filesInput-container {
        grid-column: span 2;
        border: 2px dashed var(--border-color);
        border-radius: 12px;
        padding: 20px;
        background: #fafafa;
        text-align: center;
    }

    .btnSubmit {
        width: 100%;
        max-width: 300px;
        font-weight: 600;
        font-size: 1rem;
        padding: 14px;
        border-radius: 8px;
        border: none;
        background: var(--primary-blue);
        color: #fff;
        cursor: pointer;
        transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btnSubmit:hover:not(.disabled) {
        background: var(--dark-blue);
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(39, 115, 255, 0.3);
    }

    .disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    /* Modal Styles */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        backdrop-filter: blur(4px);
    }

    .modal-content {
        background: white;
        padding: 40px;
        border-radius: 16px;
        text-align: center;
        max-width: 400px;
        width: 90%;
        animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
        from {
            transform: translateY(20px);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
</style>

<div class="orgForm-container">
    <p id="formLabel">Create New Event</p>

    <div class="txtFields-container">
        <div class="txtInputs-container full-width">
            <label for="event_name">Event Name</label>
            <input type="text" id="event_name" placeholder="Enter event title">
        </div>

        <div class="txtInputs-container full-width">
            <label for="event_desc">Event Description</label>
            <textarea id="event_desc" placeholder="What is this event about?"></textarea>
        </div>

        <div class="txtInputs-container">
            <label for="event_location">Location</label>
            <input type="text" id="event_location" placeholder="Venue or Link">
        </div>

        <div class="txtInputs-container">
            <label for="event_capacity">Capacity</label>
            <input type="number" id="event_capacity" placeholder="0">
        </div>

        <div class="txtInputs-container">
            <label for="event_start_date">Start Date</label>
            <input type="date" id="event_start_date">
        </div>

        <div class="txtInputs-container">
            <label for="event_end_date">End Date</label>
            <input type="date" id="event_end_date">
        </div>

        <div class="txtInputs-container">
            <label for="event_start_time">Start Time</label>
            <input type="time" id="event_start_time">
        </div>

        <div class="txtInputs-container">
            <label for="event_end_time">End Time</label>
            <input type="time" id="event_end_time">
        </div>

        <div class="txtInputs-container full-width">
            <label for="event_regs_deadline">Registration Deadline</label>
            <input type="datetime-local" id="event_regs_deadline">
        </div>

        <div class="section-card">
            <p>Put a Check on Restricted Year Levels</p>
            <div class="checkbox-group" id="year_levels">
                <label class="checkbox-item"><input type="checkbox" value="1st"><span>1st Year</span></label>
                <label class="checkbox-item"><input type="checkbox" value="2nd"><span>2nd Year</span></label>
                <label class="checkbox-item"><input type="checkbox" value="3rd"><span>3rd Year</span></label>
                <label class="checkbox-item"><input type="checkbox" value="4th"><span>4th Year</span></label>
                <label class="checkbox-item"><input type="checkbox" value="Alumni"><span>Alumni</span></label>
                <label class="checkbox-item"><input type="checkbox" value="Irregular"><span>Irregular</span></label>
            </div>
        </div>

        <div class="section-card">
            <p>Put a Check on Restricted Programs</p>
            <div class="checkbox-group" id="programs">
            </div>
        </div>

        <div class="filesInput-container">
            <label style="display:block; margin-bottom:10px; font-weight:600;">Event Background Photo</label>
            <input type="file" accept=".pdf,.jpg,.jpeg,.png">
        </div>

        <div class="btnSubmit-container">
            <button class="btnSubmit">Submit Application</button>
        </div>

        <p style="color: #ef4444; display: none; text-align: center; width: 100%; font-weight: 600;" id="pendingNotif">
            ⚠️ You still have a pending application.
        </p>
    </div>
</div>

<div class="modal-overlay" id="successModal">
    <div class="modal-content">
        <div style="font-size: 50px; color: #22c55e; margin-bottom: 10px;">Check!</div>
        <h2 style="color: var(--dark-blue); margin-bottom: 10px;">Success!</h2>
        <p id="modalMessage" style="color: #64748b; margin-bottom: 25px;">Your event has been submitted for review.</p>
        <button onclick="closeModalAndReload()" class="btnSubmit" style="width: 120px;">Close</button>
    </div>
</div>

<script>
    // Elements
    const btnSubmit = document.querySelector(".btnSubmit");
    const successModal = document.querySelector("#successModal");

    let restrictedEntities = {
        year_level: [],
        programs: []
    };

    // Modal Helpers
    function showModal(msg) {
        document.getElementById('modalMessage').innerText = msg;
        successModal.style.display = "flex";
    }

    function closeModalAndReload() {
        location.reload();
    }

    async function getPrograms() {
        const container = document.querySelector("#programs");
        try {
            const response = await fetch("backend/forFrontendData/getPrograms.php");
            const data = await response.json();
            container.innerHTML = "";
            data.records.forEach(e => {
                container.innerHTML += `
                <label class="checkbox-item">
                    <input type="checkbox" value="${e.program_id}">
                    <span>${e.prog_abv}</span>
                </label>`;
            });
        } catch (err) { console.error("Error fetching programs", err); }
    }

    function updateArray(arr, value, checked) {
        if (checked) {
            if (!arr.includes(value)) arr.push(value);
        } else {
            const i = arr.indexOf(value);
            if (i > -1) arr.splice(i, 1);
        }
    }

    document.addEventListener("change", (e) => {
        if (e.target.closest("#year_levels")) {
            updateArray(restrictedEntities.year_level, e.target.value, e.target.checked);
        }
        if (e.target.closest("#programs")) {
            updateArray(restrictedEntities.programs, e.target.value, e.target.checked);
        }
    });

    function checkInputValue() {
        const fields = ["event_name", "event_desc", "event_location", "event_capacity", "event_start_date", "event_end_date", "event_start_time", "event_end_time", "event_regs_deadline"];
        let isValid = true;
        fields.forEach(id => {
            const el = document.getElementById(id);
            if (!el.value.trim()) {
                isValid = false;
                el.style.borderColor = "#ef4444";
            } else {
                el.style.borderColor = "var(--border-color)";
            }
        });
        return isValid; 
    }

    btnSubmit.addEventListener("click", async () => {
        if (!checkInputValue()) {
            alert("Please fill out all required fields.");
            return;
        }
        if (document.querySelector("#event_capacity").value > 500 || document.querySelector("#event_capacity").value < 0) {
            alert("Capacity cannot be less than 0. or greater than 500.");
            return;
        }

        btnSubmit.disabled = true; // Fixed typo
        btnSubmit.classList.add("disabled");
        btnSubmit.innerText = "Processing...";

        const formData = new FormData();
        const fieldIds = ["event_name", "event_desc", "event_location", "event_capacity", "event_start_date", "event_end_date", "event_start_time", "event_end_time", "event_regs_deadline"];

        fieldIds.forEach(id => formData.append(id, document.getElementById(id).value));
        formData.append("restricted", JSON.stringify(restrictedEntities));

        const file_input = document.querySelector(".filesInput-container input[type='file']");
        if (file_input.files.length > 0) {
            formData.append("file", file_input.files[0]);
        }

        try {
            const response = await fetch("backend/forBackendData/organizerNevents/submitEvents.php", {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            if (data.status == true) {
                await sendEmail(document.getElementById("event_name").value);
                showModal("Application sent successfully! Check your email for confirmation.");
            } else {
                alert("Error: " + (data.message || "Submission failed"));
                btnSubmit.disabled = false;
                btnSubmit.classList.remove("disabled");
                btnSubmit.innerText = "Submit Application";
            }
        } catch (err) {
            console.error(err);
            btnSubmit.disabled = false;
            btnSubmit.classList.remove("disabled");
        }
    });

    async function sendEmail(event_name) {
        await fetch("backend/forBackendData/organizerNevents/sendEmail.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ "event_name": event_name })
        });
    }

    async function hasPendingRow() {
        const btnCont = document.querySelector(".btnSubmit-container");
        const pending = document.querySelector("#pendingNotif");
        try {
            const response = await fetch("backend/forBackendData/organizerNevents/checkPendingEvents.php");
            const data = await response.json();
            if (data.status == true) {
                btnCont.style.display = "none";
                pending.style.display = "block";
            }
        } catch (err) { }
    }

    document.addEventListener("DOMContentLoaded", () => {
        getPrograms();
        hasPendingRow();
    });
</script>
